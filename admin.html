<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取号系统 - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #263238;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
            text-align: center;
            margin-bottom: 20px;
        }
        .login-tip {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 16px;
        }
        .input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
        }
        .input:focus { border-color: #66bb6a; }
        .btn {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-primary { background: #43a047; }
        .btn-danger { background: #e53935; }
        .btn-secondary { background: #78909c; }
        .stats {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            flex: 1;
            background: #f5f5f5;
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
        }
        .stat-num {
            font-size: 32px;
            font-weight: bold;
            color: #2e7d32;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .records {
            margin: 16px 0;
            max-height: 350px;
            overflow-y: auto;
        }
        .record-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #555;
        }
        .record-item strong { color: #333; }
        .record-num {
            display: inline-block;
            width: 42px;
            font-weight: bold;
            color: #2e7d32;
        }
        .record-time {
            float: right;
            color: #aaa;
            font-size: 11px;
        }
        .hidden { display: none; }
        .msg {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
        }
        .msg-ok { background: #e8f5e9; color: #2e7d32; }
        .msg-err { background: #ffebee; color: #c62828; }
        .cloud-status {
            text-align: center;
            font-size: 12px;
            margin-bottom: 12px;
            padding: 6px;
            border-radius: 8px;
        }
        .cloud-ok { background: #e8f5e9; color: #2e7d32; }
        .cloud-err { background: #ffebee; color: #c62828; }
        .auto-refresh-hint {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- 登录 -->
        <div id="loginView">
            <div class="title">🔐 管理后台登录</div>
            <div class="login-tip">请输入管理员密码</div>
            <input type="password" class="input" id="pwdInput" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
            <button class="btn btn-primary" onclick="doLogin()">登录</button>
            <div id="loginMsg" class="msg hidden"></div>
        </div>

        <!-- 主面板 -->
        <div id="mainView" class="hidden">
            <div class="title">📊 取号管理面板（云端实时）</div>
            <div class="cloud-status cloud-ok" id="cloudStatus">☁️ 云端已连接</div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-num" id="curNumber">0</div>
                    <div class="stat-label">当前最大号数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="recCount">0</div>
                    <div class="stat-label">已登记人数</div>
                </div>
            </div>

            <button class="btn btn-danger" onclick="resetQueue()">🔄 重置取号（清零）</button>
            <button class="btn btn-secondary" onclick="refreshData()" style="margin-top:10px;">🔃 立即刷新</button>
            <div id="opMsg" class="msg hidden"></div>
            <div class="auto-refresh-hint" id="autoHint">⏱️ 每10秒自动刷新</div>

            <div class="records" id="recordList"></div>
        </div>
    </div>

    <script>
        // ========== 配置 ==========
        var CLOUD_URL='https://jsonblob.com/api/jsonBlob/019f9c2a-f014-7f7f-9c36-f93b26b3eaae';
        var ADMIN_PWD='yunjing2026';
        var autoTimer=null;

        function fetchCloud(){
            return fetch(CLOUD_URL,{headers:{'Accept':'application/json'}}).then(function(r){
                if(!r.ok) throw new Error('HTTP '+r.status);
                return r.json();
            });
        }

        function saveCloud(data){
            return fetch(CLOUD_URL,{
                method:'PUT',
                headers:{'Content-Type':'application/json','Accept':'application/json'},
                body:JSON.stringify(data)
            }).then(function(r){
                if(!r.ok) throw new Error('HTTP '+r.status);
                return r.json();
            });
        }

        function doLogin() {
            var pwd=document.getElementById('pwdInput').value;
            var msg=document.getElementById('loginMsg');
            if(pwd===ADMIN_PWD){
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('mainView').classList.remove('hidden');
                refreshData();
                // 自动每10秒刷新
                autoTimer=setInterval(refreshData,10000);
            }else{
                msg.textContent='\u5bc6\u7801\u9519\u8bef\uff0c\u8bf7\u91cd\u8bd5';
                msg.className='msg msg-err';
                msg.classList.remove('hidden');
            }
        }

        async function refreshData() {
            try {
                var data=await fetchCloud();
                var statusEl=document.getElementById('cloudStatus');
                statusEl.textContent='\u2601\ufe0f \u4e91\u7aef\u5df2\u8fde\u63a5 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
                statusEl.className='cloud-status cloud-ok';

                var today=new Date().toLocaleDateString('zh-CN');

                // 显示当前号数和记录数
                var curNum=data.currentNumber||0;
                var records=data.records||[];
                document.getElementById('curNumber').textContent=curNum;
                document.getElementById('recCount').textContent=records.length;

                renderRecords(records);
            }catch(e){
                var statusEl=document.getElementById('cloudStatus');
                statusEl.textContent='\u26a0\ufe0f \u4e91\u7aef\u8fde\u63a5\u5931\u8d25: '+e.message;
                statusEl.className='cloud-status cloud-err';
                showOpMsg('\u6570\u636e\u52a0\u8f7d\u5931\u8d25: '+e.message,false);
            }
        }

        function renderRecords(records) {
            var list=document.getElementById('recordList');
            if(!records.length){
                list.innerHTML='<div class="record-item" style="text-align:center;color:#999;">\u6682\u65e0\u767b\u8bb0\u8bb0\u5f55</div>';
                return;
            }
            // 倒序显示（最新在前）
            var html='';
            for(var i=records.length-1;i>=0;i--){
                var r=records[i];
                var timeStr=r.time?new Date(r.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
                html+='<div class="record-item">'+
                    '<span class="record-time">'+timeStr+'</span>'+
                    '<span class="record-num">'+String(r.number).padStart(3,'0')+'</span>'+
                    '<strong>'+escHtml(r.studentName)+'</strong> / '+escHtml(r.parentName)+' / '+escHtml(r.phone)+
                    '</div>';
            }
            list.innerHTML=html;
        }

        function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

        async function resetQueue() {
            if(!confirm('\u786e\u5b9a\u8981\u91cd\u7f6e\u53d6\u53f7\u5417\uff1f\u6240\u6709\u53f7\u6570\u5c06\u6e05\u96f64\uff08\u4eca\u65e5\u767b\u8bb0\u8bb0\u5f55\u4fdd\u7559\uff09\u3002'))return;
            try{
                var data=await fetchCloud();
                var today=new Date().toLocaleDateString('zh-CN');
                data.currentNumber=0;
                data.date=today;
                data.batch=(data.batch||0)+1;
                data.updatedAt=new Date().toISOString();
                await saveCloud(data);
                showOpMsg('\u2705 \u53d6\u53f7\u5df2\u91cd\u7f6e\u4e3a 0',true);
                refreshData();
            }catch(e){
                showOpMsg('\u91cd\u7f6e\u5931\u8d25: '+e.message,false);
            }
        }

        function showOpMsg(text,ok){
            var msg=document.getElementById('opMsg');
            msg.textContent=text;
            msg.className='msg '+(ok?'msg-ok':'msg-err');
            msg.classList.remove('hidden');
            setTimeout(function(){msg.classList.add('hidden');},4000);
        }
    </script>
</body>
</html>
