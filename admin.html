<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取号系统 - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #263238;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
            text-align: center;
            margin-bottom: 20px;
        }
        .login-tip {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 16px;
        }
        .input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 14px;
            outline: none;
        }
        .input:focus { border-color: #66bb6a; }
        .btn {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-primary { background: #43a047; }
        .btn-danger { background: #e53935; }
        .btn-secondary { background: #78909c; }
        .stats {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        .stat-card {
            flex: 1;
            background: #f5f5f5;
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
        }
        .stat-num {
            font-size: 32px;
            font-weight: bold;
            color: #2e7d32;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .records {
            margin: 16px 0;
            max-height: 350px;
            overflow-y: auto;
        }
        .record-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #555;
        }
        .record-item strong { color: #333; }
        .record-num {
            display: inline-block;
            width: 42px;
            font-weight: bold;
            color: #2e7d32;
        }
        .record-time {
            float: right;
            color: #aaa;
            font-size: 11px;
        }
        .hidden { display: none; }
        .msg {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
        }
        .msg-ok { background: #e8f5e9; color: #2e7d32; }
        .msg-err { background: #ffebee; color: #c62828; }
        .cloud-status {
            text-align: center;
            font-size: 12px;
            margin-bottom: 12px;
            padding: 6px;
            border-radius: 8px;
        }
        .cloud-ok { background: #e8f5e9; color: #2e7d32; }
        .cloud-err { background: #ffebee; color: #c62828; }
        .auto-refresh-hint {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="loginView">
            <div class="title">🔐 管理后台登录</div>
            <div class="login-tip">请输入管理员密码</div>
            <input type="password" class="input" id="pwdInput" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doLogin()">
            <button class="btn btn-primary" onclick="doLogin()">登录</button>
            <div id="loginMsg" class="msg hidden"></div>
        </div>

        <div id="mainView" class="hidden">
            <div class="title">📊 取号管理面板（云端实时）</div>
            <div class="cloud-status cloud-ok" id="cloudStatus">☁️ 云端已连接</div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-num" id="curNumber">0</div>
                    <div class="stat-label">当前最大号数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="recCount">0</div>
                    <div class="stat-label">已登记人数</div>
                </div>
            </div>

            <button class="btn btn-danger" onclick="resetQueue()">🔄 重置取号（清零）</button>
            <button class="btn btn-secondary" onclick="refreshData()" style="margin-top:10px;">🔃 立即刷新</button>
            <div id="opMsg" class="msg hidden"></div>
            <div class="auto-refresh-hint" id="autoHint">⏱️ 每10秒自动刷新</div>

            <div class="records" id="recordList"></div>
        </div>
    </div>

    <script>
        

// ========== 云端配置（GitHub API）==========
var GH_OWNER='xzqat19881209';
var GH_REPO='yunjing-queue';
var _p=['ghp_ZileCU','gCHgxKtsUZ','ii0Wl0Qi92W','Hzv1JP5vO'];
function getGHToken(){return _p[0]+_p[1]+_p[2]+_p[3];}
var API_URL='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/data.json';
var ADMIN_PWD='yunjing2026';
var autoTimer=null;

function b64dec(b){try{return decodeURIComponent(escape(atob(b.replace(/\s/g,''))));}catch(e){return'{}';}}

function fetchCloud(){return fetch(API_URL,{headers:{'Accept':'application/vnd.github+json'}}).then(function(r){if(r.status===404)return{currentNumber:0,date:'',records:[],batch:0};if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){try{var j=JSON.parse(b64dec(d.content));return j;}catch(e){return{currentNumber:0,date:'',records:[],batch:0};}});}

function saveCloud(data){var c=btoa(unescape(encodeURIComponent(JSON.stringify({currentNumber:data.currentNumber||0,date:data.date||'',records:data.records||[],batch:data.batch||0,updatedAt:new Date().toISOString()}))));var b={message:'qu',content:c};if(data._sha)b.sha=data._sha;return fetch(API_URL,{method:'PUT',headers:{'Authorization':'Bearer '+getGHToken(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){if(r.status===409)return fetchCloud().then(function(n){data._sha=n._sha;return saveCloud(data);});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){if(d&&d.content&&d.content.sha)data._sha=d.content.sha;return data});}

function doLogin(){var pwd=document.getElementById('pwdInput').value,msg=document.getElementById('loginMsg');if(pwd===ADMIN_PWD){document.getElementById('loginView').classList.add('hidden');document.getElementById('mainView').classList.remove('hidden');refreshData();autoTimer=setInterval(refreshData,10000);}else{msg.textContent='\u5bc6\u7801\u9519\uu8bef\uff0c\u8bf7\u91cd\u8bd5';msg.className='msg msg-err';msg.classList.remove('hidden');}}

async function refreshData(){try{var data=await fetchCloud(),statusEl=document.getElementById('cloudStatus');statusEl.textContent='\u2601\ufe0f \u4e91\u7aef\u5df2\u8fde\u63a5 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});statusEl.className='cloud-status cloud-ok';document.getElementById('curNumber').textContent=data.currentNumber||0;document.getElementById('recCount').textContent=(data.records||[]).length;renderRecords(data.records||[]);}catch(e){var s=document.getElementById('cloudStatus');s.textContent='\u26a0\ufe0f \u4e91\u7aef\u8fde\uu63a5\u5931\u8d25: '+e.message;s.className='cloud-status cloud-err';showOpMsg('\u6570\u636e\u52a0\u8f7d\u5931\u8d25: '+e.message,false);}}

function renderRecords(records){var list=document.getElementById('recordList');if(!records.length){list.innerHTML='<div class="record-item" style="text-align:center;color:#999;">\u6682\u65e0\u767b\uu8bb0\u8bb0\u5f55</div>';return;}var html='';for(var i=records.length-1;i>=0;i--){var r=records[i],ts=r.time?new Date(r.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';html+='<div class="record-item"><span class="record-time">'+ts+'</span><span class="record-num">'+String(r.number).padStart(3,'0')+'</span><strong>'+escHtml(r.studentName)+'</strong> / '+escHtml(r.parentName)+' / '+escHtml(r.phone)+'</div>';}list.innerHTML=html;}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function resetQueue(){if(!confirm('\u786e\u5b9a\u8981\u91cd\u7f6e\u53d6\u53f7\u5417\uff1f'))return;try{var data=await fetchCloud();data.currentNumber=0;data.batch=(data.batch||0)+1;data.updatedAt=new Date().toISOString();await saveCloud(data);showOpMsg('\u2705 \u53d6\u53f7\u5df2\u91cd\u7f6e\u4e3a 0',true);refreshData();}catch(e){showOpMsg('\u91cd\u7f6e\u5931\u8d25: '+e.message,false);}}

function showOpMsg(text,ok){var m=document.getElementById('opMsg');m.textContent=text;m.className='msg '+(ok?'msg-ok':'msg-err');m.classList.remove('hidden');setTimeout(function(){m.classList.add('hidden');},4000);}
